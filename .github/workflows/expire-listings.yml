name: Expire Lapsed Listings

# Closing dates pass every day, but the sitemap and public pages only change when the data does.
# This job runs `npm run expire` shortly after midnight in South Africa and, if anything lapsed,
# opens ONE pull request with the expiry and the regenerated pages. It never pushes to main:
# a person reviews and merges the pull request.
#
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
# Note: pull requests created with the default GITHUB_TOKEN do not start other workflows, so run
# the Quality Gates manually (Actions > Quality Gates > Run workflow) on the branch if you want them.
on:
  schedule:
    - cron: '10 22 * * *' # 00:10 South Africa time (UTC+2), every day
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: expire-listings
  cancel-in-progress: false

jobs:
  expire:
    name: Expire lapsed listings and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mark lapsed listings as expired
        run: node scripts/mark-expired.js

      - name: Regenerate static pages and sitemap
        run: npm run sitemap

      # The unit tests assert facts about specific records, so expiring a listing can break one.
      # Catch that here, before a pull request is opened, rather than on main after it is merged.
      - name: Run unit tests
        run: npm test

      - name: Validate the result
        run: |
          npm run validate
          npm run validate:routes
          npm run validate:pages

      - name: Summarise listings that need a manual re-check
        run: |
          {
            echo '## Open listings with no closing date'
            node scripts/list-undated-open.js
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing lapsed today; no pull request needed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="automation/expire-lapsed"
          TODAY="$(TZ=Africa/Johannesburg date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "data: expire lapsed listings ($TODAY)" \
            -m "Generated by the Expire Lapsed Listings workflow: npm run expire, then npm run sitemap, validated with npm run validate, validate:routes and validate:pages."
          git push --force origin "$BRANCH"

          BODY="Automated daily expiry ($TODAY, South Africa time).

          - Ran \`npm run expire\`, then \`npm run sitemap\`.
          - Passed \`npm test\`, \`npm run validate\`, \`validate:routes\` and \`validate:pages\` in this job.
          - Expired listings leave the public pages and the sitemap once this is merged.
          - Listings with no closing date are never expired automatically; see the job summary.

          Review the diff, then merge. Quality Gates do not start automatically on bot-created pull requests."

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr edit "$BRANCH" --title "data: expire lapsed listings ($TODAY)" --body "$BODY"
            echo "Updated the open pull request for $BRANCH." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base main --head "$BRANCH" --title "data: expire lapsed listings ($TODAY)" --body "$BODY"
          fi
