name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-and-sitemap:
    name: Validate content and sitemap
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run unit tests
        run: npm test

      - name: Validate JSON content
        run: npm run validate

      - name: Check opportunity links
        run: npm run links

      - name: Generate crawlable SEO pages and sitemap
        run: npm run sitemap

      - name: Validate generated routes, canonicals, and sitemap
        run: npm run validate:routes

      - name: Validate GitHub Pages custom-domain configuration
        run: npm run validate:pages

      - name: Ensure generated SEO files are committed and current
        run: |
          git status --short -- sitemap.xml learnerships internships bursaries apprenticeships tvet-pathways guides calendar provinces tools about
          git diff -- sitemap.xml bursaries/index.html calendar/index.html provinces/eastern-cape/index.html provinces/free-state/index.html provinces/gauteng/index.html provinces/kwazulu-natal/index.html provinces/limpopo/index.html provinces/mpumalanga/index.html provinces/north-west/index.html provinces/northern-cape/index.html provinces/western-cape/index.html bursaries/funza-lushaka-bursary-2027-first-time-applicants/index.html
          test -z "$(git status --porcelain -- sitemap.xml learnerships internships bursaries apprenticeships tvet-pathways guides calendar provinces tools about)"
