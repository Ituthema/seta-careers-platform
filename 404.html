<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Page Not Found — OpportunitiesZA</title>
<script>
  // GitHub Pages SPA routing fix:
  // Old-style path URLs (e.g. /opportunity/001, /learnerships/some-slug from
  // the pre-hash sitemap) land here as real 404s. Convert them into the
  // equivalent hash route and redirect there — index.html's router will
  // then load the right content instead of silently falling back to home.
  const path = window.location.pathname;

  if (!path.match(/\.\w{2,4}$/)) {
    const parts = path.split('/').filter(Boolean);
    let target = '/';

    // Mirrors index.html's catPathMap/pathCatMap — keep in sync
    // (see docs/architecture/frontend.md "Keeping These in Sync").
    const catMap = { learnerships:'learnership', bursaries:'bursary', internships:'internship', apprenticeships:'apprenticeship', 'tvet-pathways':'tvet' };

    if (parts[0] === 'opportunity' && parts[1]) {
      target = `/#/opportunity/${parts[1]}`;
    } else if (parts[0] === 'guides' && parts[1]) {
      target = `/#/guides/${parts[1]}`;
    } else if (catMap[parts[0]] && parts[1]) {
      // The router can resolve category-plural + slug directly to the
      // specific opportunity (RouterWrapper.apply()'s pathCatMap
      // branch) — preserve the slug instead of degrading to the
      // generic filtered directory.
      target = `/#/${parts[0]}/${parts[1]}`;
    } else if (parts[0]) {
      // Category-plural path with no slug segment (e.g. bare
      // /learnerships/), or an unrecognized single-segment path —
      // best effort: send to the matching directory filter, or the
      // guides list for guide categories.
      const guideCats = new Set(['seta-guides','career-advice']);
      if (catMap[parts[0]]) target = `/#/directory/${catMap[parts[0]]}`;
      else if (guideCats.has(parts[0])) target = '/#/guides';
      else target = '/#/';
    }

    window.location.replace(target);
  }
</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',system-ui,sans-serif;background:#f8fafc;color:#1a1a1a;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:48px 40px;max-width:480px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
  .icon{font-size:64px;margin-bottom:20px;display:block}
  h1{font-size:72px;font-weight:900;color:#0d4a26;line-height:1;margin-bottom:8px}
  h2{font-size:22px;font-weight:700;color:#111;margin-bottom:12px}
  p{font-size:15px;color:#6b7280;line-height:1.7;margin-bottom:28px}
  a{display:inline-block;padding:13px 28px;background:#0d4a26;color:#fff;border-radius:9px;font-weight:700;font-size:15px;text-decoration:none}
  a:hover{background:#083318}
  .sub{font-size:12px;color:#9ca3af;margin-top:20px}
</style>
</head>
<body>
<!-- Fallback content in case JS redirect above doesn't fire (e.g. JS disabled) -->
<div class="card">
  <span class="icon">🧭</span>
  <h1>404</h1>
  <h2>Page not found</h2>
  <p>This page doesn't exist — but thousands of verified learnerships, bursaries, and internships do. Let's get you back on track.</p>
  <a href="/">Back to Opportunities</a>
  <p class="sub">OpportunitiesZA · South Africa's Career Opportunity Platform</p>
</div>
</body>
</html>
